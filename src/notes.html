<title>챗봇 설계 공부노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 지도 앱처럼 L0 한 장 지도 → L1 흐름 → L2 부품 안쪽 → L3 판단 규칙으로 눌러서 확대. 위에는 현재 위치(빵부스러기), 오른쪽은 용어 풀이 + Claude에게 묻기. 색 의미는 핵심판 PPT와 같다(청록=서비스, 보라=에이전트, 노랑=저장소, 주황=통제·검사, 초록=통과·만듦) */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --panel:#EEF1F5; --ink:#1F2430; --muted:#4A5262; --faint:#7D8696; --line:#D5DAE2;
  --teal:#1F7A8C; --teal-t:#E2F0F3; --purple:#6B4FA0; --purple-t:#ECE7F5; --coral:#C0502F; --coral-t:#F8E6E0;
  --amber:#9A6A12; --amber-t:#FBF1DD; --green:#3B8A57; --green-t:#E2F1E7; --on-accent:#FFFFFF;
  --f-head:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-body:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --f-mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171D; --surface:#1C2028; --panel:#232833; --ink:#E8EBF0; --muted:#B4BCC8; --faint:#8A93A3; --line:#323947;
  --teal:#5FB7C7; --teal-t:#16323A; --purple:#A991D9; --purple-t:#2A2340; --coral:#E8835F; --coral-t:#3A2219;
  --amber:#E0B25A; --amber-t:#352A14; --green:#6FC08C; --green-t:#183020; --on-accent:#0E1A1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171D; --surface:#1C2028; --panel:#232833; --ink:#E8EBF0; --muted:#B4BCC8; --faint:#8A93A3; --line:#323947;
  --teal:#5FB7C7; --teal-t:#16323A; --purple:#A991D9; --purple-t:#2A2340; --coral:#E8835F; --coral-t:#3A2219;
  --amber:#E0B25A; --amber-t:#352A14; --green:#6FC08C; --green-t:#183020; --on-accent:#0E1A1D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0}
h1{font-size:24px;font-weight:600}
h2{font-size:21px;font-weight:600}
h3{font-size:15px;font-weight:600}
header,.wrap{max-width:1200px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
header p{margin:0;color:var(--muted);font-size:14px}
.top{display:flex;gap:6px;flex-wrap:wrap}
.top a{font-size:13.5px;text-decoration:none;color:var(--muted);padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.top a.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.crumbs{max-width:1200px;margin:0 auto 10px;font-size:13.5px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--teal);text-decoration:none}
.crumbs[hidden]{display:none}
.crumbs b{color:var(--ink);font-weight:500}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px;align-items:start}
@media (max-width:920px){.wrap{grid-template-columns:1fr}}
main{min-width:0}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.lv{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;padding:2px 9px;border-radius:999px;margin-bottom:6px}
.lv-L0{background:var(--panel);color:var(--ink)}.lv-L1{background:var(--teal-t);color:var(--teal)}.lv-L2{background:var(--purple-t);color:var(--purple)}
.lv-L3{background:var(--amber-t);color:var(--amber)}.lv-q{background:var(--coral-t);color:var(--coral)}
.lead{color:var(--muted);margin:6px 0 14px;max-width:70ch}
.fig{margin:4px 0 6px}
.fig svg{display:block;width:100%;height:auto}
.scroll{overflow-x:auto}
.zoom{margin-top:16px;display:grid;gap:8px}
.zoom h3{font-size:13.5px;color:var(--faint);font-weight:500}
.zl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.zl a{display:block;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);background:var(--bg)}
.zl a span{display:block;font-size:12.5px;color:var(--faint)}
.zl a:hover,.zl a:focus-visible{border-color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font-family:var(--f-body);font-size:14px;padding:7px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--teal);color:var(--on-accent);border-color:var(--teal)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.tm{font:inherit;padding:0;border:0;background:none;color:inherit;border-bottom:1.5px dotted var(--teal);border-radius:0;cursor:help}
[data-go]{cursor:pointer}
[data-go]:hover rect,[data-go]:focus-visible rect{stroke-width:2.2}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.ck{flex:1 1 150px;border-radius:10px;padding:10px 12px;border:1.5px solid var(--line);background:var(--bg);min-width:0}
.ck b{display:block;font-family:var(--f-head);font-weight:600;font-size:14px}
.ck small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.ar{align-self:center;color:var(--faint)}
.k-teal{border-color:var(--teal);background:var(--teal-t)}.k-purple{border-color:var(--purple);background:var(--purple-t)}
.k-amber{border-color:var(--amber);background:var(--amber-t)}.k-coral{border-color:var(--coral);background:var(--coral-t)}
.k-green{border-color:var(--green);background:var(--green-t)}.k-gray{border-style:dashed}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.col{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.col h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:1px 9px;border-radius:999px;font-weight:500}
.p-green{background:var(--green-t);color:var(--green)}.p-coral{background:var(--coral-t);color:var(--coral)}.p-amber{background:var(--amber-t);color:var(--amber)}
.mono{font-family:var(--f-mono);font-size:12.5px;background:var(--panel);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:pre}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;background:var(--panel)}
.note{background:var(--amber-t);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.stations{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:10px}
@media (max-width:560px){.stations{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stn{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;font-size:12px;color:var(--faint);background:var(--panel)}
.stn b{display:block;font-size:13px;color:var(--ink);font-weight:500}
.stn.on{background:var(--teal-t);border-color:var(--teal);color:var(--teal)}
.step{border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:140px}
.step .k{font-size:12.5px;color:var(--faint)}
.step .t{font-family:var(--f-head);font-size:17px;font-weight:600;margin:2px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.warn{background:var(--amber-t);color:var(--amber);border-color:transparent}
.chip.ok{background:var(--green-t);color:var(--green);border-color:transparent}
.navrow{display:flex;align-items:center;gap:10px;margin-top:10px}
.dots{display:flex;gap:5px;flex:1;justify-content:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}.dot.on{background:var(--teal)}
.bar-row{display:grid;grid-template-columns:140px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:13px;margin:5px 0;font-variant-numeric:tabular-nums}
.bar{height:13px;border-radius:4px}
@media (max-width:560px){.bar-row{grid-template-columns:100px minmax(0,1fr) 66px;font-size:12px}}
.nest{border-radius:12px;padding:12px 14px 14px;border:1.5px solid}
.nest>.lbl{font-weight:600;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nest>.lbl span{font-weight:400;font-size:12.5px;font-family:var(--f-mono)}
.n1{border-color:var(--coral);background:var(--coral-t)}.n2{border-color:var(--purple);background:var(--surface)}
.n3{border-color:var(--teal);background:var(--teal-t)}.n4{border-color:var(--amber);background:var(--surface);border-style:dashed}
.walls{display:grid;grid-template-columns:96px repeat(6,minmax(104px,1fr));gap:5px;font-size:12.5px;min-width:760px}
.walls .h{font-weight:500;color:var(--muted);text-align:center;padding:4px}
.walls .r{font-weight:600;display:flex;align-items:center;padding:4px}
.cell{border-radius:8px;padding:6px 7px;min-height:52px}
.ok{background:var(--green-t);color:var(--green)}
.no{background:var(--coral-t);color:var(--coral);border:1.5px dashed var(--coral);text-align:left;font-size:12.5px;width:100%}
.wait{background:var(--panel);color:var(--faint)}
.na{color:var(--faint);display:flex;align-items:center;justify-content:center}
.pr{display:inline-block;font-size:11px;font-weight:600;border:1px solid currentColor;border-radius:8px;padding:0 5px;margin-right:3px}
.qz{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.qz .q{font-weight:500}
textarea{width:100%;min-height:64px;resize:vertical;font-family:var(--f-body);font-size:14px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ans{background:var(--green-t);border-radius:9px;padding:9px 12px;font-size:14px}
.fb{background:var(--purple-t);border-radius:9px;padding:9px 12px;font-size:14px;white-space:pre-wrap}
.done-ck{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-left:auto}
.review{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.review label{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;display:flex;gap:6px;align-items:center;background:var(--panel)}
aside{position:sticky;top:max(12px,env(safe-area-inset-top,0px));display:grid;gap:12px;min-width:0}
@media (max-width:920px){aside{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px;min-width:0}
#gloss .w{font-family:var(--f-head);font-weight:600;font-size:16px;color:var(--teal)}
#gloss .a{font-weight:500}
#gloss .e{font-size:13.5px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
#log{display:grid;gap:8px;max-height:40vh;overflow-y:auto}
.msg{border-radius:10px;padding:8px 11px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{background:var(--panel);justify-self:end;max-width:92%}.msg.c{background:var(--teal-t)}
.small{font-size:12.5px;color:var(--faint)}
.err{color:var(--coral);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div><h1>챗봇 설계 공부노트</h1><p>한 장 지도에서 시작해 상자를 눌러 확대하세요. 밑줄 단어를 누르면 뜻이 나옵니다.</p></div>
  <nav class="top" aria-label="바로 가기"><a href="#map" id="tMap">지도</a><a href="#walls" id="tWalls">검증벽</a><a href="#quiz" id="tQuiz">퀴즈</a></nav>
</header>
<nav class="crumbs" id="crumbs" aria-label="현재 위치"></nav>
<div class="wrap">
  <main id="main"></main>
  <aside>
    <div class="card" id="gloss" aria-live="polite"><h3>용어 풀이</h3><div class="hint">그림과 글의 <span style="border-bottom:1.5px dotted var(--teal)">밑줄 단어</span>를 누르면 여기에 뜻이 나와요.</div></div>
    <div class="card">
      <h3>Claude에게 묻기</h3>
      <div class="hint">이 노트를 근거로 쉬운 말로 답합니다. 첫 질문 때 허락을 한 번 묻고, 지금 쓰는 Claude 요금제 사용량으로 동작합니다.</div>
      <div class="row"><button id="explainView">지금 보는 그림 쉽게 설명해 줘</button></div>
      <div id="log" aria-live="polite"></div>
      <label for="askbox" class="small">질문 (Ctrl+Enter 로 보내기)</label>
      <textarea id="askbox" placeholder="예: critic 이 다시 쓰게 하면 왜 시간이 두 배가 되나요?"></textarea>
      <div class="row"><button id="askBtn" class="primary">묻기</button><button id="stopBtn" hidden>멈추기</button><button id="clearBtn">대화 지우기</button></div>
      <div class="err" id="askErr"></div>
    </div>
  </aside>
</div>

<script>
const T={
 'LLM':['말을 아주 잘하는 두뇌','글을 읽고 쓰는 거대한 모델. 혼자서는 파일을 열거나 명령을 실행하지 못한다.'],
 '에이전트':['두뇌 + 손발','도구를 골라 쓰며 일이 끝날 때까지 반복하는 루프. 여기서는 LangGraph 로 만든 에이전트 서비스.'],
 'LangGraph':['에이전트용 흐름도 도구','노드(일하는 칸)와 갈림길을 그래프로 이어 에이전트를 만든다. 각 노드가 다음 노드를 goto 로 정한다.'],
 'LiteLLM':['모델 앞의 안내 창구(AI 게이트웨이)','서비스는 chat-small · chat-large · embed 같은 별명만 부르고, 실제 모델(로컬 Ollama 또는 Azure)은 LiteLLM 설정이 정한다. 이 챗봇에서는 에이전트(router 분류 · 답 쓰기 · critic 판정) · 검색 서비스(임베딩) · 채팅 서비스(제목 요약) 세 곳이 부른다. 대체(폴백) · 서비스별 키 · 사용량 기록도 맡는다. 사람이 들어오는 API 게이트웨이와 달리, 모델로 나가는 문이다.'],
 '게이트웨이':['건물 정문','사용자(브라우저) 요청이 들어오는 단일 입구. 주소를 보고 알맞은 서비스로 보낸다(라우트). 서비스끼리 부를 때는 거치지 않고 바로 부른다(ADR-001).'],
 'SSE':['한 방향 생중계','서버가 연결을 열어 둔 채 글자를 조금씩 밀어 보내는 방식. 그래서 답이 타자 치듯 나온다.'],
 '라우터':['길 안내 담당','원래 뜻은 데이터가 갈 길(route)을 정하는 네트워크 장비(공유기). 여기서는 질문을 S1~S4 로 보내는 노드.'],
 '확신도':['스스로 매긴 자신감','0~1 사이 숫자. 확률이 아니라 모델이 글로 써 낸 자기 평가라서 맞는지 골든셋으로 재 봐야 한다.'],
 'critic':['검사 담당 선배','초안의 주장마다 근거와 맞는지 확인하고, 어긋나면 같은 워커에게 다시 쓰게 한다(최대 2회).'],
 '워커':['분야별 담당자','S1 상품 · S2 프로모션 · S3 정책 FAQ · S4 홍보 문구를 각각 맡아 초안을 쓰는 노드.'],
 'RAG':['오픈북 시험','외운 것으로 답하지 않고 자료를 찾아 출처와 함께 답한다. 근거가 없으면 기권한다.'],
 '임베딩':['문장을 숫자 좌표로','뜻이 비슷한 문장은 가까운 좌표가 되도록 숫자 목록(벡터)으로 바꾼다. 여기서는 bge-m3 모델, 1024개 숫자.'],
 'BM25':['키워드 검색 점수','질문의 단어가 문서에 얼마나 자주, 얼마나 드물게 나오는지로 점수를 매긴다. Elasticsearch 가 계산한다.'],
 'RRF':['순위 합치기','점수 대신 순위만 쓴다. 각 검색에서 r등이면 1/(60+r) 점을 주고 더한다. 두 검색 모두에서 앞쪽인 문서가 이긴다.'],
 '시간 제한':['기다리는 한도','이 시간 안에 답이 없으면 끊는다(timeout). 안쪽 층이 바깥보다 짧아야 원인이 남는다.'],
 '골든셋':['모범 답안이 붙은 시험지','질문과 정답(의도 · 근거 ID · 요점) 짝. 바꿀 때마다 다시 풀려 품질이 떨어지지 않았는지 본다.'],
 '온도':['답을 고르는 대담함','0이면 늘 가장 그럴듯한 말(일관성), 높을수록 다양한 말(창의성). 성능이 아니다. gpt-5-mini 는 1만 받는다.'],
 '시드 데이터':['처음 심는 씨앗 자료','합성 상품 · 프로모션 · 정책 · FAQ · 관계 데이터. 실제 개인정보는 쓰지 않는다(R-2).'],
 '개인정보 가림':['전화번호 지우개','채팅 서비스가 질문 속 전화번호 · 이메일 같은 개인정보를 가린 뒤 저장하고 에이전트에 넘긴다(PiiMasker).'],
 '되묻기':['손님에게 한 번 더 확인','확신이 약하면 짐작으로 보내지 않고 후보 2개를 보여 주며 묻는다. 연속 1회까지만.'],

stn.forEach((e,j)=>{e.tabIndex=0;e.setAttribute('role','button');e.setAttribute('aria-label',e.querySelector('b').textContent+' 단계로');
 const jump=()=>{let k=STEPS.findIndex(x=>x[0][0]===j);if(k<0)k=STEPS.findIndex(x=>x[0].includes(j));if(k>=0){si=k;drawStep()}};e.onclick=jump;e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();jump()}}});

/* 저장(이 브라우저에만) */
const KEY='study-notes-v2';let store={};try{store=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('study-notes-v1')||'{}')}catch(e){store={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}

/* 퀴즈 */
const days=['오늘','내일','3일 뒤','7일 뒤'];store.review=store.review||{};store.quiz=store.quiz||{};
days.forEach(d=>{const l=document.createElement('label');const cb=document.createElement('input');cb.type='checkbox';cb.id='rv-'+d;cb.checked=!!store.review[d];cb.onchange=()=>{store.review[d]=cb.checked;save()};l.append(cb,document.createTextNode(d+' 복습'));document.getElementById('review').appendChild(l)});
QUIZ.forEach(([q,a],i)=>{const box=document.createElement('div');box.className='qz';
 box.innerHTML='<div class="q"></div><textarea></textarea><div class="row"><button class="show">정답 보기</button><button class="grade">Claude에게 채점받기</button><label class="done-ck"><input type="checkbox"> 이제 설명할 수 있어요</label></div><div class="ans" hidden></div><div class="fb" hidden></div>';
 box.querySelector('.q').textContent=(i+1)+'. '+q;const ta=box.querySelector('textarea');ta.id='qa-'+i;ta.placeholder='내 말로 먼저 적어 보세요';
 const st=store.quiz[i]||{};ta.value=st.t||'';const ck=box.querySelector('input');ck.id='qd-'+i;ck.checked=!!st.d;
 ta.oninput=()=>{store.quiz[i]={...(store.quiz[i]||{}),t:ta.value};save()};ck.onchange=()=>{store.quiz[i]={...(store.quiz[i]||{}),d:ck.checked};save()};
 const ans=box.querySelector('.ans');ans.textContent='모범 답: '+a;box.querySelector('.show').onclick=()=>{ans.hidden=!ans.hidden};
 const gb=box.querySelector('.grade'),fb=box.querySelector('.fb');
 gb.onclick=async()=>{if(!ta.value.trim()){fb.hidden=false;fb.textContent='먼저 내 답을 적어 주세요.';ta.focus();return}
  gb.disabled=true;fb.hidden=false;fb.textContent='채점 중…';
  try{const s=await sampleFn();if(!s)throw{code:'not_granted'};
   const {text}=await s('너는 친절한 학습 도우미다. 학생 답을 모범 답과 비교해 한국어 짧은 문장으로 채점하라. 첫 줄은 "맞음", "부분 정답", "다시 보기" 중 하나. 다음 줄부터 잘한 점 1개, 빠진 핵심 1~2개, 기억 요령 1개. 5줄 이내, 마크다운 기호 없이.\n\n질문: '+q+'\n모범 답: '+a+'\n학생 답: '+ta.value,{modelTier:'quick',onText:({text})=>{fb.textContent=text}});
   fb.textContent=text}catch(e){fb.textContent=errCopy(e)}finally{gb.disabled=false}};
 document.getElementById('quizList').appendChild(box)});

/* 이동: 해시 라우팅 + 빵부스러기 */
function chainOf(id){const c=[];let k=id;while(k){c.unshift(k);k=V[k].parent}return c}
// 주소 뒤 @숫자 = 여정의 몇 번째 단계(0부터). 지도에서 누른 부품의 단계로 바로 연다
function route(){const [h,st]=location.hash.slice(1).split('@');const id=V[h]?h:'map';
 if(id==='journey'&&st!==undefined&&STEPS[+st]){si=+st;drawStep()}
 document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='v-'+id);
 const cr=document.getElementById('crumbs');cr.innerHTML='';cr.hidden=chainOf(id).length<2;chainOf(id).forEach((k,i,arr)=>{if(i)cr.append(' › ');
  if(i===arr.length-1){const b=document.createElement('b');b.textContent=V[k].name;cr.appendChild(b)}else{const a=document.createElement('a');a.href='#'+k;a.textContent=V[k].name;cr.appendChild(a)}});
 [['tMap','map'],['tWalls','walls'],['tQuiz','quiz']].forEach(([e,k])=>document.getElementById(e).classList.toggle('on',chainOf(id)[0]===k||id===k));
 store.view=id;save();if(window.scrollY>200)window.scrollTo({top:0,behavior:'smooth'})}
addEventListener('hashchange',route);if(!location.hash&&store.view&&V[store.view])history.replaceState(null,'','#'+store.view);route();

/* 그림 상자 누르면 확대 · 용어 · 질문 버튼 */
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){location.hash=g.dataset.go;return}
 const t=e.target.closest('[data-term]');if(t){showTerm(t.dataset.term);return}
 const q=e.target.closest('[data-ask]');if(q)ask(q.dataset.ask)});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('[data-go]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();location.hash=g.dataset.go}});
function showTerm(w){const [a,e]=T[w];const box=document.getElementById('gloss');box.innerHTML='<h3>용어 풀이</h3><div class="w"></div><div class="small f"></div><div class="a"></div><div class="e"></div><div class="row"><button type="button">이 용어 더 물어보기</button></div>';
 box.querySelector('.w').textContent=w;box.querySelector('.f').textContent=FULL[w]?'원래 이름: '+FULL[w]:'';box.querySelector('.a').textContent=a;box.querySelector('.e').textContent=e;box.querySelector('button').onclick=()=>ask('"'+w+'"를 이 리테일 챗봇의 예로 쉽게 설명해 줘.')}

/* Claude에게 묻기 */
let sampleP=null;function sampleFn(){if(!sampleP)sampleP=(window.claude&&claude.use)?claude.use('sample'):Promise.resolve(null);return sampleP}
function plain(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim()}
function notes(){return Object.entries(V).filter(([k])=>k!=='quiz').map(([k,v])=>'['+LVNAME[v.lv]+' · '+v.t+'] '+plain(rich(v.lead))+' '+plain(v.body).slice(0,1500)).join('\n\n')+
 '\n\n[여정 단계] '+STEPS.map((s,i)=>(i+1)+'. '+s[1]+' — '+s[2]+': '+s[3]).join(' ')+'\n\n[용어] '+Object.entries(T).map(([w,[a,e]])=>w+(FULL[w]?' ['+FULL[w]+']':'')+'('+a+'): '+e).join(' ')+
 '\n\n[학습자] 리테일 챗봇(Vue · Spring · FastAPI · LangGraph · k3d · LiteLLM)을 실습 중인 학생. 강사는 항상 "강사님"으로 부른다.'}
const RULES='너는 이 공부노트를 함께 보는 친절한 학습 도우미다. 아래 노트를 근거로 한국어 짧은 문장으로 답하라. 용어는 처음 나올 때 쉬운 말로 풀어라. 노트에 없는 내용은 일반 지식으로 답하되 "노트 밖 내용"이라고 밝혀라. 마크다운 기호(#, **, 표)는 쓰지 말고 줄바꿈과 번호만 써라. 마지막 줄에 스스로 떠올려 볼 질문 1개를 붙여라.\n\n=== 노트 ===\n'+notes();
let turns=[];try{turns=JSON.parse(sessionStorage.getItem('study-chat')||'[]')}catch(e){turns=[]}
function keepChat(){try{sessionStorage.setItem('study-chat',JSON.stringify(turns.slice(-12)))}catch(e){}}
const log=document.getElementById('log');
function bubble(role,text){const d=document.createElement('div');d.className='msg '+(role==='user'?'u':'c');d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
turns.forEach(t=>bubble(t.role,t.content));
function errCopy(e){const c=e&&e.code;return c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'?'이 보기에서는 Claude 에게 물을 수 없어요. 허락을 거절했다면 새로고침 후 다시 허락해 주세요. claude.ai 밖(내 PC 파일)에서는 묻기가 동작하지 않아요.':c==='rate_limited'?'잠시 쉬었다가 다시 물어봐 주세요(사용량 한도).':c==='session_expired'?'다시 로그인해 주세요.':c==='refused'?'이 질문은 답할 수 없어요. 질문을 바꿔 주세요.':c==='cancelled'?'멈췄어요.':'연결이 잠깐 끊겼어요. 다시 눌러 주세요.'}
let ctl=null;const askErr=document.getElementById('askErr');
async function ask(q){q=(q||'').trim();if(!q){askErr.textContent='질문을 먼저 적어 주세요.';document.getElementById('askbox').focus();return}
 askErr.textContent='';const s=await sampleFn();
 if(!s){askErr.textContent='여기서는 Claude 에게 물을 수 없어요. claude.ai 에서 이 페이지를 열어 주세요.';return}
 bubble('user',q);turns.push({role:'user',content:q});keepChat();const out=bubble('assistant','생각 중…');ctl=new AbortController();
 for(const id of ['askBtn','explainView'])document.getElementById(id).disabled=true;document.getElementById('stopBtn').hidden=false;
 try{const {text,truncated}=await s([{role:'user',content:RULES},...turns.slice(-8)],{cache:false,signal:ctl.signal,onText:({text})=>{out.textContent=text;log.scrollTop=log.scrollHeight}});
  out.textContent=text+(truncated?'\n(답이 길어 잘렸어요. 나눠서 물어봐 주세요.)':'');turns.push({role:'assistant',content:text});keepChat()}
 catch(e){out.textContent=(e&&e.text)||'';if(!(e&&e.text))out.remove();turns.pop();keepChat();if(!(e&&e.code==='cancelled'))askErr.textContent=errCopy(e)}
 finally{for(const id of ['askBtn','explainView'])document.getElementById(id).disabled=false;document.getElementById('stopBtn').hidden=true;ctl=null}}
document.getElementById('askBtn').onclick=()=>{const b=document.getElementById('askbox');const q=b.value;b.value='';ask(q)};
document.getElementById('askbox').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();document.getElementById('askBtn').click()}});
document.getElementById('stopBtn').onclick=()=>ctl&&ctl.abort();
document.getElementById('clearBtn').onclick=()=>{turns=[];keepChat();log.innerHTML=''};
document.getElementById('explainView').onclick=()=>{const v=V[store.view||'map'];ask('지금 보고 있는 "'+v.t+'"('+LVNAME[v.lv]+') 그림을 처음 배우는 사람에게 설명하듯 핵심 3가지로 쉽게 설명해 줘.')};
</script>
